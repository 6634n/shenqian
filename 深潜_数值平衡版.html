<script>
window.onerror = function(msg, url, line) {
  const stage = document.getElementById('stage');
  if (stage) {
    stage.innerHTML = `<div style="color:#8a4436;padding:20px;font-size:18px;line-height:1.6;">
      <b>运行出错：</b><br>${msg}<br><br>错误行号: ${line}<br>
      <p style="margin-top:20px;color:#8b8270;">请截图此信息反馈。</p>
    </div>`;
  }
  return true;
};
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:24px;line-height:1.6;color:#3b352b;background:#e6e0d1;
  overscroll-behavior:none;
}
#app{
  position:relative;display:flex;flex-direction:column;
  width:100%;max-width:600px;height:100vh;height:100dvh;
  margin:0 auto;background:#faf7ef;
  box-shadow:0 0 30px rgba(70,60,40,.10);
}
#statusbar{
  flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
  padding:12px 16px;background:#f1ecdd;border-bottom:1px solid #ddd5c0;
  font-size:16px;color:#5d5544;min-height:48px;
}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
.chip b{font-weight:600;color:#3b352b;}
.hpbar{width:60px;height:8px;background:#dcd4be;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
.hpbar i{display:block;height:100%;background:#7a9a6a;transition:width .25s;}
.darkmode .hpbar i{background:#a0503c;}
#stage{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:20px 20px 30px;-webkit-overflow-scrolling:touch;
}
#narrative p{margin:0 0 16px;word-break:break-all;}
#narrative .sys{color:#8b8270;font-size:18px;line-height:1.5;}
#narrative .em{color:#8a4436;}
#narrative .good{color:#4f7a4a;}
.dicebar{
  margin:0 0 20px;padding:12px 16px;
  background:#eef3e8;border:1px solid #c6d6bc;border-radius:12px;
  font-size:18px;line-height:1.5;text-align:center;color:#3f5a36;
  animation:fadein .18s ease;
}
.dicebar.bad{background:#f8ece8;border-color:#e2c6ba;color:#8a4436;}
.dicebar .big{display:block;font-size:22px;font-weight:600;margin-bottom:4px;letter-spacing:.5px;}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#actions{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
.opt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:64px;padding:16px 20px;
  background:#fffdf6;border:1px solid #d9d1bc;border-radius:14px;
  font-size:24px;color:#3b352b;text-align:center;line-height:1.4;
  font-family:inherit;cursor:pointer;
  transition:background .12s,transform .07s;
  user-select:none;
}
.opt:active{background:#efe9d8;transform:scale(.99);}
.opt.primary{background:#eef3e8;border-color:#c6d6bc;color:#3f5a36;}
.opt.danger{background:#faf0ec;border-color:#e2c8bc;color:#8a4436;}
.opt.warn{background:#faf0ec;border-color:#e2c8bc;color:#8a4436;}
.opt small{display:block;font-size:16px;color:#8b8270;margin-top:6px;font-weight:400;line-height:1.3;}
#tabs{
  flex:0 0 auto;display:flex;border-top:1px solid #ddd5c0;background:#f1ecdd;
  padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{
  flex:1;padding:14px 0;background:none;border:none;
  font-size:16px;color:#7a7160;font-family:inherit;cursor:pointer;
  transition:background .12s;
}
#tabs button:active{background:#e5dfcd;}
#tabs button:disabled{opacity:.35;}
#overlay{
  position:absolute;inset:0;background:rgba(58,53,44,.38);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
#overlay.hidden{display:none;}
#panel{
  width:100%;max-height:82%;overflow-y:auto;
  background:#faf7ef;border-radius:20px 20px 0 0;
  padding:24px 20px calc(30px + env(safe-area-inset-bottom));
  animation:slideup .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes slideup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#panel h3{font-size:22px;margin-bottom:16px;color:#3b352b;font-weight:600;}
#panel h4{font-size:18px;margin:20px 0 8px;color:#6f6650;font-weight:600;}
.row{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 0;border-bottom:1px dashed #e0d9c6;
}
.row:last-child{border-bottom:none;}
.row .info{flex:1;min-width:0;}
.row .info b{font-size:20px;font-weight:600;}
.row .info .sys{font-size:16px;color:#8b8270;line-height:1.5;margin-top:4px;}
.row button{
  flex:0 0 auto;padding:10px 16px;border:1px solid #c6d6bc;background:#eef3e8;
  border-radius:10px;font-size:18px;color:#3f5a36;font-family:inherit;cursor:pointer;
}
.row button:active{background:#e0ead9;}
.sys{font-size:16px;color:#8b8270;}
textarea{
  width:100%;height:100px;padding:12px;border:1px solid #d9d1bc;border-radius:10px;
  background:#fffdf6;font-family:ui-monospace,Menlo,monospace;font-size:14px;
  color:#5d5544;resize:none;line-height:1.5;
}
.bigbtn{
  width:100%;padding:16px;margin-top:12px;border:1px solid #c6d6bc;
  background:#eef3e8;border-radius:12px;font-size:20px;color:#3f5a36;
  font-family:inherit;cursor:pointer;
}
.bigbtn:active{background:#e0ead9;}
.bigbtn.warn{background:#faf0ec;border-color:#e2c8bc;color:#8a4436;}
.tag{display:inline-block;padding:2px 8px;background:#ece7d6;border-radius:6px;font-size:14px;color:#7a7160;margin-left:6px;vertical-align:middle;}

.grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.grid-item {
  background: #fffdf6; border: 1px solid #d9d1bc; border-radius: 10px;
  padding: 12px 6px; text-align: center; font-size: 16px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 70px; user-select: none;
}
.grid-item:active { background: #efe9d8; }
.grid-item b { font-size: 18px; margin-bottom: 4px; line-height: 1.2; }
.grid-item small { font-size: 13px; color: #8b8270; line-height: 1.2; }

#custom-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
#custom-modal.show { opacity: 1; pointer-events: auto; }
#custom-modal .modal-box {
  background: #faf7ef; width: 80%; max-width: 400px; border-radius: 16px;
  padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transform: translateY(20px); transition: transform 0.2s;
  max-height: 70vh; overflow-y: auto;
}
#custom-modal.show .modal-box { transform: none; }
#custom-modal h3 { font-size: 22px; margin-bottom: 12px; color: #3b352b; }
#custom-modal p { font-size: 18px; line-height: 1.6; color: #5d5544; white-space: pre-wrap; margin-bottom: 16px; }
#custom-modal button {
  width: 100%; padding: 12px; background: #eef3e8; border: 1px solid #c6d6bc;
  border-radius: 10px; font-size: 18px; color: #3f5a36; font-family: inherit; cursor: pointer;
}

.title-wrap{padding-top:40px;text-align:center;}
.title-wrap h1{font-size:48px;letter-spacing:8px;font-weight:600;color:#3b352b;}
.title-wrap .sub{font-size:16px;letter-spacing:4px;color:#a0957c;margin-top:8px;}
.title-wrap .blurb{
  margin:30px auto 20px;max-width:380px;text-align:left;
  font-size:20px;line-height:1.8;color:#6f6650;
}
</style>
</head>

</div>

          } else {
            RUN.hp -= 5;
            setScene('<p>祭坛的魔力排斥你，你受到了反噬。</p>', [{label:'继续', cls:'primary', fn: afterNode}]);
          }
        }},
      {label:'离开', res:{text:'你敬畏地离开了祭坛。'}}
    ]}
];

const META_KEY = 'shenqian_meta_v1';
let META = {bestiary:{}, deaths:[], endings:[], runs:0, wins:0};
let RUN = null;

function loadMeta(){
  try{
    const raw = localStorage.getItem(META_KEY);
    if (raw){ const o = JSON.parse(raw); META = Object.assign(META, o); }
  }catch(e){}
}
function saveMeta(){
  try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){}
}

function b64e(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64d(b){
  const bin = atob(b);
  const bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function exportCode(){
  const data = { v:1, meta:META, run:RUN ? serializeRun(RUN) : null };
  return 'SP1.' + b64e(JSON.stringify(data));
}
function serializeRun(r){
  return {
    cls:r.cls, attrs:r.attrs, hp:r.hp, maxHp:r.maxHp, shield:r.shield||0,
    torches:r.torches, gold:r.gold, luck:r.luck,
    inv:r.inv, traits:r.traits, floor:r.floor, step:r.step,
    potionMap:r.potionMap, identified:r.identified, atkBonus:r.atkBonus||0,
    level:r.level, exp:r.exp, nextExp:r.nextExp,
    forgeCount:r.forgeCount||0, boughtEnchant:r.boughtEnchant||false, bonusDef:r.bonusDef||0,
    subclass:r.subclass, floorFarms:r.floorFarms
  };
}
function importCode(code){
  code = (code||'').trim();
  if (code.indexOf('SP1.') !== 0) throw new Error('存档码格式不正确');
  const obj = JSON.parse(b64d(code.slice(4)));
  if (!obj || obj.v !== 1) throw new Error('存档码版本不支持');
  META = Object.assign({bestiary:{},deaths:[],endings:[],runs:0,wins:0}, obj.meta||{});
  if (!META.endings) META.endings = [];
  saveMeta();
  if (obj.run){
    RUN = Object.assign({scene:null,combat:null,lastDice:null,log:[],nodes:[],level:1, exp:0, nextExp:20, shield:0, forgeCount:0, boughtEnchant:false, bonusDef:0, subclass:null, floorFarms:0}, obj.run);
    resumeRun();
  } else {
    RUN = null;
    render();
  }
}

function isPotion(id){ return id.indexOf('potion') === 0; }
function potionColorIndex(id){ return +id.slice(6); }
function getItemDef(id){
  if (isPotion(id)){
    const ci = potionColorIndex(id);
    const known = RUN && RUN.identified[ci];
    const p = RUN ? POTIONS[RUN.potionMap[ci]] : POTIONS[0];
    return {
      name: known ? p.name : POTION_COLORS[ci] + '色药水',
      desc: known ? p.text : '一瓶' + POTION_COLORS[ci] + '色的液体。需要鉴定卷轴或学者进行鉴定。',
      type:'use', potion:true, colorIndex:ci
    };
  }
  return ITEMS[id] || {name:'未知物', desc:'', type:'tool'};
}
function addItem(id){
  RUN.inv.push({id});
  return getItemDef(id).name;
}
function removeItem(id) {
  const idx = RUN.inv.findIndex(i=>i.id===id);
  if(idx>=0) RUN.inv.splice(idx,1);
}
function getWeaponObj(){
  for (const it of RUN.inv){
    const d = ITEMS[it.id];
    if (d && d.type === 'weapon') return it;
  }
  return null;
}
function getDef(){
  let d = RUN.bonusDef || 0;
  RUN.traits.forEach(t => { if (TRAITS[t] && TRAITS[t].def) d += TRAITS[t].def; });
  return d;
}
function hasTrait(id){ return RUN.traits.indexOf(id) >= 0; }
function getTraitPenalty(){
  let penalty = { str:0, dex:0, int:0, wis:0, atk:0, dmgTaken:0 };
  RUN.traits.forEach(t => {
    if (t === 'weak') penalty.atk -= 2;
    if (t === 'slow') penalty.dex -= 2;
    if (t === 'blind') penalty.wis -= 2;
    if (t === 'bad_luck') penalty.dmgTaken += 1;
  });
  return penalty;
}

function applyEff(eff){
  if (!eff) return;
  if (Array.isArray(eff)) eff = pick(eff);
  if (eff.hp) RUN.hp = clamp(RUN.hp + eff.hp, 0, RUN.maxHp);
  if (eff.hpPct) RUN.hp = clamp(RUN.hp + Math.floor(RUN.maxHp * eff.hpPct), 0, RUN.maxHp);
  if (eff.maxHp) { RUN.maxHp += eff.maxHp; RUN.hp += eff.maxHp; }
  if (eff.torches) RUN.torches = Math.max(0, RUN.torches + eff.torches);
  if (eff.gold) RUN.gold = Math.max(0, RUN.gold + eff.gold);
  if (eff.luck) RUN.luck += eff.luck;
  if (eff.atk) RUN.atkBonus = (RUN.atkBonus||0) + eff.atk;
  if (eff.atkBonus) RUN.atkBonus = (RUN.atkBonus||0) + eff.atkBonus;
  if (eff.attr) {
    if (eff.attr === 'all') {
      RUN.attrs.str += 1; RUN.attrs.dex += 1; RUN.attrs.int += 1; RUN.attrs.wis += 1;
    } else {
      RUN.attrs[eff.attr] += 1;
    }
  }
  if (eff.item) addItem(eff.item);
  if (eff.trait && !hasTrait(eff.trait)){
    if (eff.trait === 'sage' && hasTrait('sage')) {
      eff.trait = 'scholar_omniscient';
    }
    if (!hasTrait(eff.trait)) {
      RUN.traits.push(eff.trait);
      const t = TRAITS[eff.trait];
      if (t && t.luck) RUN.luck += t.luck;
      if (t && t.shield) RUN.shield = (RUN.shield||0) + t.shield;
      if (t && t.maxHpPenalty) { RUN.maxHp -= t.maxHpPenalty; RUN.hp = Math.min(RUN.hp, RUN.maxHp); }
    }
  }
}

function doCheck(attr, dc, tag){
  if (RUN.cls === 'scholar' && attr === 'int' && hasTrait('scholar_omniscient')) {
    const roll = d20();
    if (roll !== 1) {
      RUN.lastDice = { bad:false, html:'<span class="big">大贤者</span>必成功' };
      return 'great';
    }
  }

  const roll = d20();
  const pen = getTraitPenalty();
  let bonus = getMod(RUN.attrs[attr]) + (pen[attr] || 0);
  const parts = [fmtSigned(getMod(RUN.attrs[attr])) + '属性'];
  
  if (pen[attr]) parts.push(fmtSigned(pen[attr]) + '负面词条');

  const cls = CLASSES.find(c=>c.id === RUN.cls);
  if (tag && cls && cls.tagBonus && cls.tagBonus[tag]){
    bonus += cls.tagBonus[tag];
    parts.push(fmtSigned(cls.tagBonus[tag]) + '职业');
  }
  if (attr === 'int' && hasTrait('sage')) {
    bonus += 2;
    parts.push('+2 贤者');
  }
  for (const it of RUN.inv){
    const d = ITEMS[it.id];
    if (d && d.bonus && tag && d.bonus[tag]){
      bonus += d.bonus[tag];
      parts.push(fmtSigned(d.bonus[tag]) + d.name);
    }
  }
  if (RUN.torches <= 0){
    bonus -= 5;
    parts.push('-5 黑暗');
  }
  const total = roll + bonus;
  let tier;
  if (roll === 1) tier = 'crit';
  else if (roll === 20 || total >= dc + 10) tier = 'great';
  else if (total >= dc) tier = 'success';
  else if (total >= dc - 4) tier = 'fail';
  else tier = 'crit';

  const label = {str:'力量',dex:'敏捷',int:'智力',wis:'感知'}[attr] || attr;
  const tierName = {great:'大成功',success:'成功',fail:'失败',crit:'大失败'}[tier];
  const bad = (tier === 'fail' || tier === 'crit');
  RUN.lastDice = {
    bad: bad,
    html: '<span class="big">' + label + '检定 · ' + tierName + '</span>' +
      'd20(' + roll + ') ' + parts.join(' ') + ' = ' + total + ' vs DC ' + dc
  };
  return tier;
}

function rollNodes(){
  // 每层有不同的路口权重：前期偏探索与补给，后期逐步增加战斗和危险。
  const weightsByFloor = {
    1: {combat:1, event:3, treasure:2, trap:1, merchant:2, rest:3, shrine:1, blacksmith:1},
    2: {combat:2, event:3, treasure:2, trap:1, merchant:2, rest:2, shrine:1, blacksmith:1},
    3: {combat:2, event:3, treasure:2, trap:2, merchant:1, rest:2, shrine:2, blacksmith:1},
    4: {combat:3, event:2, treasure:2, trap:2, merchant:1, rest:2, shrine:1, blacksmith:2},
    5: {combat:4, event:2, treasure:2, trap:2, merchant:1, rest:2, shrine:1, blacksmith:2}
  };
  const weights = weightsByFloor[RUN.floor] || weightsByFloor[5];
  const pool = [];
  const bag = Object.keys(weights).flatMap(type => Array(weights[type]).fill(type));
  while (pool.length < 3 && bag.length) {
    const index = rnd(bag.length);
    const chosen = bag[index];
    if (!pool.includes(chosen)) pool.push(chosen);
    // 移除该类型的所有权重，确保三个路口类型不同。
    for (let i = bag.length - 1; i >= 0; i--) if (bag[i] === chosen) bag.splice(i, 1);
  }
  return pool.map(t => Math.random() < 0.10 ? 'unknown' : t);
}
function useTorch(n){
  RUN.torches = Math.max(0, RUN.torches - n);
}
function goFloor(){
  RUN.step = 0;
  RUN.floorFarms = 0;
  RUN.nodes = rollNodes();
  renderFloor();
}
function renderFloor(){
  const names = {combat:'战斗',event:'事件',treasure:'宝藏',trap:'陷阱',merchant:'商人',rest:'休息',shrine:'神龛',blacksmith:'铁匠',unknown:'未知'};
  const subs = {
    combat:'有什么东西在前面等着', event:'不知道会遇到什么',
    treasure:'也许有好东西', trap:'地面看起来不太对',
    merchant:'隐约有说话声', rest:'有火光',
    shrine:'有一座石像', blacksmith:'传来打铁声', unknown:'看不清'
  };
  const opts = RUN.nodes.map(t => ({
    label: names[t] + '<small>' + subs[t] + '</small>',
    fn: () => enterNode(t)
  }));
  const dark = RUN.torches <= 0;
  const html = '<p>第 ' + RUN.floor + ' 层 · 第 ' + (RUN.step + 1) + ' / 10 个路口</p>' +
    '<p class="sys">火把 ' + RUN.torches + ' ｜ 生命 ' + RUN.hp + '/' + RUN.maxHp + ' ｜ 金币 ' + RUN.gold + '</p>' +
    (dark ? '<p class="em">黑暗笼罩着你。火把烧完了，所有检定 DC +5。</p>' : '') +
    '<p>你面前有三条路。火把的火苗在风里歪了一下。</p>';
  setScene(html, opts);
}
function enterNode(type){
  if (type === 'unknown') type = pick(['combat','event','treasure','trap']);
  useTorch(1);
  RUN.step++;
  
  if (hasTrait('wound')) {
    RUN.hp -= 1;
    RUN.log.push('伤口作痛，生命 -1。');
    if (RUN.hp <= 0) return die('伤口感染而死。');
  }
  if (hasTrait('broken_pocket')) {
    RUN.gold = Math.max(0, RUN.gold - 2);
  }
  if (hasTrait('gluttony') && Math.random() < 0.3) {
    const foodIdx = RUN.inv.findIndex(it => ['ration','bandage','sausage','cheese','tomato','bread','burger'].includes(it.id));
    if (foodIdx >= 0) {
      RUN.inv.splice(foodIdx, 1);
      RUN.log.push('暴食发作，你忍不住吃掉了背包里的食物！');
    }
  }

  if (RUN.torches <= 0) RUN.log.push('火把熄灭了。');
  
  if (type === 'combat') {
    const pool = [];
    for (const k in ENEMIES) {
      const e = ENEMIES[k];
      if (e.boss || e.miniboss || e.is_hidden) continue;
      if (e.layer === RUN.floor) pool.push(k);
    }
    return startCombat(pick(pool));
  }
  
  if (type === 'event') {
    let avail = EVENTS.filter(e => (!e.req || e.req === RUN.cls) && (!e.floor || e.floor.includes(RUN.floor)));
    
    if (RUN.floor === 3 && !RUN.subclass) {
      const specialEvents = avail.filter(e => e.floor && e.floor.includes(3) && e.req === RUN.cls);
      if (specialEvents.length > 0 && Math.random() < 0.6) {
        return showEvent(pick(specialEvents));
      }
    }
    
    let normalEvents = avail.filter(e => !e.floor || !e.floor.includes(3));
    if (!normalEvents || normalEvents.length === 0) normalEvents = EVENTS;
    return showEvent(pick(normalEvents));
  }
  
  if (type === 'treasure') {
    const tPool = ['chest', 'glowing'];
    const evId = pick(tPool);
    const ev = EVENTS.find(e => e.id === evId);
    return showEvent(ev || EVENTS[0]);
  }
  
  if (type === 'trap') {
    return showEvent({
      text:'地面有一块颜色略深的石砖。你的脚刚踩上去，砖块就下沉了半寸。',
      opts:[
        {label:'立刻后跳', check:{attr:'dex',dc:13,tag:'dodge'},
          res:{great:{text:'你干净利落地跳开，地刺在你刚才站的地方弹起。你在旁边捡到了几枚掉落的金币。',eff:{gold:15}},
               success:{text:'你跳开了，但鞋底被划了一道。你顺手摸到了墙缝里的几枚硬币。',eff:{hp:-1, gold:5}},
               fail:{text:'地刺弹出，扎进你的小腿。',eff:{hp:-5}},
               crit:{text:'你被地刺钉在原地，挣扎了好一会儿才脱身。毒液让你感到无比虚弱。',eff:{hp:-4, trait:'weak'}}}},
        {label:'硬扛过去', res:{text:'地刺弹起，你硬着头皮踩了过去。', eff:{hp:-4}}}
      ]
    });
  }
  
  if (type === 'merchant') return showMerchant();
  if (type === 'rest') return showRest();
  if (type === 'shrine') return showShrine();
  if (type === 'blacksmith') return showBlacksmith();
  return afterNode();
}

function showEvent(ev){
  if (!ev) return afterNode();
  if (!ev.opts) ev.opts = [{label:'离开', res:{text:'什么也没有发生。'}}];
  
  const opts = ev.opts.map(o => ({
    label: o.label,
    fn: () => {
      if (o.fn) return o.fn();
      resolveOption(o);
    }
  }));
  setScene('<p>' + (ev.text || '...') + '</p>', opts);
}
function resolveOption(opt){
  let res;
  if (opt.check){
    // 地下层数越深，检定略微提高难度；每两层增加 1 DC，避免前后层完全一样。
    const scaledDC = opt.check.dc + Math.floor((RUN.floor - 1) / 2);
    const tier = doCheck(opt.check.attr, scaledDC, opt.check.tag);
    res = opt.res[tier];
  } else {
    res = opt.res;
  }
  if (!res) res = opt.res.success || opt.res;
  let eff = opt.dynamicEff ? opt.dynamicEff(res) : res.eff;
  if (Array.isArray(eff)) eff = pick(eff);
  if (eff && typeof eff === 'object') eff = Object.assign({}, eff);
  // 探索事件的伤害按层数温和递增，并设置单次上限。避免 24 点初始生命被一个宝箱事件直接打掉近三分之一。
  if (eff && typeof eff.hp === 'number' && eff.hp < 0) {
    const rawDamage = Math.abs(eff.hp);
    const layerCap = Math.min(5, 3 + Math.floor((RUN.floor - 1) / 2));
    const scaledDamage = Math.max(1, Math.ceil(rawDamage * 0.45));
    eff.hp = -Math.min(layerCap, scaledDamage);
  }
  applyEff(eff);

  let text = '<p>' + res.text + '</p>';
  if (eff){
    const notes = [];
    if (eff.gold) notes.push('金币 ' + fmtSigned(eff.gold));
    if (eff.hp) notes.push('生命 ' + fmtSigned(eff.hp));
    if (eff.hpPct) notes.push('生命百分比恢复');
    if (eff.maxHp) notes.push('生命上限 ' + fmtSigned(eff.maxHp));
    if (eff.atkBonus) notes.push('攻击力 ' + fmtSigned(eff.atkBonus));
    if (eff.attr) notes.push('属性提升');
    if (eff.torches) notes.push('火把 ' + fmtSigned(eff.torches));
    if (eff.luck) notes.push('幸运 ' + fmtSigned(eff.luck));
    if (eff.item) notes.push('获得：' + getItemDef(eff.item).name);
    if (eff.trait) notes.push('获得词条：' + TRAITS[eff.trait].name);
    if (notes.length) text += '<p class="sys">' + notes.join('　') + '</p>';
  }

  if (RUN.hp <= 0){ return die('你倒下了。'); }

  if (eff && eff.combat){
    const eid = eff.combat;
    setScene(text, [{label:'迎战', cls:'danger', fn: () => startCombat(eid)}]);
    return;
  }
  setScene(text, [{label:'继续', cls:'primary', fn: afterNode}]);
}

function startCombat(id){
  const e = ENEMIES[id];
  if (!e) return afterNode();
  
  const known = !!META.bestiary[id];
  let mult = 1;
  if (e.layer) mult = 1 + (RUN.floor - 1) * 0.1;
  else mult = 1 + (RUN.floor - 1) * 0.2;
  
  const scaledHp = Math.floor(e.hp * mult);
  const scaledAtkMin = Math.floor(e.atk[0] * mult);
  const scaledAtkMax = Math.floor(e.atk[1] * mult);
  
  RUN.combat = { 
    id: id, 
    hp: scaledHp, 
    maxHp: scaledHp, 
    known: known, 
    round: 1,
    atk: [scaledAtkMin, scaledAtkMax]
  };
  META.bestiary[id] = { seen:true };
  saveMeta();
  
  let prefix = '你遭遇了什么东西。';
  if (hasTrait('flame') && hasTrait('fire_mastery')) {
    let burn = 3 + RUN.floor;
    RUN.combat.hp -= burn;
    prefix = '你用火油泼洒，火焰瞬间吞噬了它！（造成 ' + burn + ' 点开局伤害）';
    if (RUN.combat.hp <= 0) return killEnemy(prefix);
  }
  
  showCombat(prefix);
}
function showCombat(prefix){
  const cb = RUN.combat;
  const e = ENEMIES[cb.id];
  const bar = '<span class="sys">（' + cb.hp + '/' + cb.maxHp + '）</span>';
  let name = cb.known ? '<b>' + e.name + '</b>' : '未名的东西';
  let html = '<p>' + (prefix || '') + '</p>';
  html += '<p>' + name + bar + '<br>' + e.desc + '</p>';
  if (cb.known && e.info) html += '<p class="sys">情报：' + e.info + '</p>';
  else html += '<p class="sys">你从未见过这种东西。</p>';
  html += '<p class="sys">火把 ' + RUN.torches + ' ｜ 生命 ' + RUN.hp + '/' + RUN.maxHp + (RUN.shield?' (护盾'+RUN.shield+')':'') + '</p>';

  const opts = [];
  
  if (hasTrait('arrogance') && cb.round === 1) {
    html += '<p class="em">你的傲慢让你不屑于先出手，第一回合只能防守！</p>';
  } else {
    opts.push({label:'挥击', cls:'danger', fn:() => playerAttack()});
    
    let subName = RUN.subclass ? ' ('+getSubclassData().name+')' : '';
    if (RUN.cls === 'warrior') opts.push({label:'舍生一击'+subName, cls:'danger', fn:() => warriorSkill()});
    if (RUN.cls === 'rogue') opts.push({label:'连斩'+subName, cls:'danger', fn:() => rogueSkill()});
    if (RUN.cls === 'scholar') opts.push({label:'祈祷'+subName, fn:() => scholarSkill()});
  }

  opts.push({label:'观察', fn:() => observeEnemy()});
  opts.push({label:'用物品', fn:() => openBagPanel()});
  opts.push({label:'逃跑', fn:() => flee()});
  setScene(html, opts);
}
function playerAttack(){
  const cb = RUN.combat;
  const e = ENEMIES[cb.id];
  const wIt = getWeaponObj();
  const wId = wIt ? wIt.id : null;
  const w = wId ? ITEMS[wId] : {dmg:[1,3], name:'拳头'};
  
  let dmgMin = w.dmg[0], dmgMax = w.dmg[1];
  if (wIt && wIt.customDmg) {
    dmgMin += wIt.customDmg;
    dmgMax += wIt.customDmg;
  }
  
  const useStr = RUN.attrs.str >= RUN.attrs.dex;
  const attr = useStr ? 'str' : 'dex';
  const roll = d20();
  const pen = getTraitPenalty();
  let bonus = getMod(RUN.attrs[attr]) + (pen[attr]||0);
  
  const cls = CLASSES.find(c=>c.id === RUN.cls);
  if (cls.tagBonus.combat) bonus += cls.tagBonus.combat;
  
  if (hasTrait('keen')) bonus += TRAITS.keen.atkCheck;
  if (hasTrait('gambler')) bonus += 5;
  if (hasTrait('sniper') && cb.round === 1) bonus += 5;
  if (hasTrait('berserk') && RUN.hp <= RUN.maxHp * 0.3) bonus += 3;
  if (RUN.torches <= 0) bonus -= 5;
  
  const total = roll + bonus;
  let text = '';
  
  if (hasTrait('gambler') && roll === 1) {
    let selfDmg = 5;
    RUN.hp -= selfDmg;
    text = '你孤注一掷，却失手砍中了自己！受到 ' + selfDmg + ' 点伤害。';
    if (RUN.hp <= 0) return die('你被自己杀死了。');
    cb.round++;
    return showCombat(text);
  }

  if (roll === 1 || total < e.ac - 4){
    text = '你挥空了。' + (roll === 1 ? '重心不稳，差点摔倒。' : '');
  } else if (total < e.ac){
    text = '你的攻击擦过它，没有造成实质伤害。';
  } else {
    let baseDmg = dmgMin + rnd(dmgMax - dmgMin + 1) + (RUN.atkBonus||0) + Math.max(1, getMod(RUN.attrs[attr])) + (pen.atk||0);
    let extra = '';
    
    if (hasTrait('berserk') && RUN.hp <= RUN.maxHp * 0.3) { baseDmg += 2; extra += '（狂暴）'; }
    if (hasTrait('cursed_power')) {
      let curses = RUN.traits.filter(t => TRAITS[t].curse || t==='weak'||t==='slow'||t==='blind'||t==='bad_luck').length;
      if (curses > 0) { baseDmg += curses * 2; extra += '（诅咒之力）'; }
    }
    if (hasTrait('blood_pact')) { baseDmg += 3; extra += '（血契）'; }
    
    let isFire = false;
    if (e.vuln === 'fire' && hasTrait('flame')){
      baseDmg *= 2; extra += '（火焰克制·翻倍）'; isFire = true;
    }
    if (isFire && hasTrait('fire_mastery')) { baseDmg += 3; extra += '（火焰精通）'; }
    if (isFire && hasTrait('blue_flame')) { baseDmg += 1; extra += '（蓝焰）'; }
    
    if (e.resist === 'physical') {
      baseDmg = Math.floor(baseDmg * 0.5);
      extra += '（物理抗性·减半）';
    }
    
    if (hasTrait('executioner') && cb.hp < cb.maxHp * 0.2) {
      baseDmg *= 2; extra += '（处决）';
    }
    
    if (RUN.cls === 'rogue' && hasTrait('rogue_fatal') && roll === 20) {
      baseDmg *= 3; extra += '（致命一击！）';
    }
    
    if (hasTrait('glass_cannon')) { baseDmg *= 2; extra += '（玻璃大炮）'; }
    
    baseDmg = Math.max(1, Math.floor(baseDmg));
    cb.hp -= baseDmg;
    text = '你的' + w.name + '命中，造成 ' + baseDmg + ' 点伤害。' + extra;
    
    if (hasTrait('lifesteal')) {
      let heal = 1;
      if (RUN.hp + heal > RUN.maxHp && hasTrait('vampire')) {
        let overflow = (RUN.hp + heal) - RUN.maxHp;
        RUN.shield = (RUN.shield||0) + overflow;
        RUN.hp = RUN.maxHp;
        text += ' (吸血鬼溢出转化为护盾)';
      } else {
        RUN.hp = clamp(RUN.hp + heal, 0, RUN.maxHp);
        text += ' (回复1点生命)';
      }
    }
  }
  if (cb.hp <= 0) return killEnemy(text);

  let ed = cb.atk[0] + rnd(cb.atk[1] - cb.atk[0] + 1);
  let def = getDef();
  
  if (RUN.cls === 'warrior' && hasTrait('warrior_unyielding') && RUN.hp <= RUN.maxHp * 0.3) {
    def += 5;
    text += '（不屈之躯：防御+5）';
  }
  
  if (hasTrait('dodge')) ed = Math.max(1, ed - 1);
  let real = Math.max(1, ed - def);
  if (pen.dmgTaken) real += pen.dmgTaken;
  
  if (hasTrait('glass_cannon')) { real *= 2; text += '（玻璃大炮反噬）'; }
  
  if (RUN.shield > 0) {
    if (RUN.shield >= real) {
      RUN.shield -= real;
      text += ' 护盾为你抵挡了 ' + real + ' 点伤害。';
      real = 0;
    } else {
      real -= RUN.shield;
      text += ' 护盾破碎，你受到 ' + real + ' 点伤害。';
      RUN.shield = 0;
      if (hasTrait('paladin')) {
        cb.hp -= 10;
        text += '（圣骑士：护盾破裂，圣光对敌人造成 10 点伤害）';
        if (cb.hp <= 0) return killEnemy(text);
      }
    }
  } else {
    text += ' 它反击了，你受到 ' + real + ' 点伤害。';
  }
  
  RUN.hp -= real;
  
  if (hasTrait('thorn')){
    let reflect = 2;
    cb.hp -= reflect;
    text += '（荆棘反弹 ' + reflect + ' 点）';
    if (hasTrait('vamp')) {
      let heal = reflect;
      if (RUN.hp + heal > RUN.maxHp && hasTrait('vampire')) {
        RUN.shield = (RUN.shield||0) + ((RUN.hp + heal) - RUN.maxHp);
        RUN.hp = RUN.maxHp;
      } else {
        RUN.hp = clamp(RUN.hp + heal, 0, RUN.maxHp);
      }
      text += '（吸血 +' + reflect + '）';
    }
    if (cb.hp <= 0) return killEnemy(text);
  }
  if (RUN.hp <= 0) return die('你被' + (cb.known ? e.name : '那东西') + '杀死了。');
  cb.round++;
  showCombat(text);
}

      baseDmg = Math.floor(baseDmg * mult);
      
      if (e.vuln === 'fire' && hasTrait('flame')) { baseDmg *= 2; text += '（火焰附魔）'; }
      if (hasTrait('glass_cannon')) { baseDmg *= 2; text += '（玻璃大炮）'; }
      baseDmg = Math.max(1, baseDmg);
      
      cb.hp -= baseDmg;
      text += ' 命中！造成 ' + baseDmg + ' 点毁灭伤害。';
      
      if (RUN.subclass === 'blood_warrior') {
        let heal = Math.floor(baseDmg * 0.3);
        RUN.hp = clamp(RUN.hp + heal, 0, RUN.maxHp);
        text += ' 嗜血：回复 ' + heal + ' 点生命。';
      }
    }
    
    if (hpct > 0) {
      let heal = Math.floor(RUN.maxHp * hpct);
      RUN.hp = clamp(RUN.hp + heal, 0, RUN.maxHp);
      text += ' 圣光治愈了你 ' + heal + ' 点生命。';
    }
    
    if (cb.hp <= 0) return killEnemy(text);
    
    let ed = cb.atk[0] + rnd(cb.atk[1] - cb.atk[0] + 1);
    let def = getDef();
    if (RUN.cls === 'warrior' && hasTrait('warrior_unyielding') && RUN.hp <= RUN.maxHp * 0.3) def += 5;
    let real = Math.max(1, ed - def);
    if (RUN.shield > 0) {
      if (RUN.shield >= real) { RUN.shield -= real; text += ' 护盾抵挡了反击。'; real = 0; }
      else { real -= RUN.shield; RUN.shield = 0; }
    }
    RUN.hp -= real;
    if (real > 0) text += ' 它反击造成 ' + real + ' 点伤害。';
    
    if (RUN.hp <= 0) return die('你倒下了。');
    cb.round++;
    showCombat(text);
  }
}

function killEnemy(prefix){
  const cb = RUN.combat;
  const e = ENEMIES[cb.id];
  let text = (prefix ? prefix + ' ' : '') + '它散架了。';
  
  let baseGold = 5 + rnd(8) + RUN.floor * 2 + (e.elite ? 10 : 0) + (e.boss ? 30 : 0) + (e.miniboss ? 20 : 0);
  let expGain = 10 + (e.elite ? 15 : 0) + (e.miniboss ? 30 : 0) + (e.is_hidden ? 50 : 0);
  
  RUN.floorFarms = (RUN.floorFarms || 0) + 1;
  let penalty = 1;
  if (RUN.floorFarms > 35) penalty = 0;
  else if (RUN.floorFarms > 25) penalty = 0.2;
  else if (RUN.floorFarms > 15) penalty = 0.5;
  
  let gold = Math.floor(baseGold * penalty);
  expGain = Math.floor(expGain * penalty);
  
  RUN.gold += gold;
  text += '你从它身上搜到 ' + gold + ' 枚金币。';
  
  if (hasTrait('vamp')){
    let heal = hasTrait('vamp_lord') ? 5 : 3;
    if (hasTrait('vamp_lord') && (e.elite || e.miniboss)) {
      RUN.hp = RUN.maxHp;
      text += '（血族领主：生命回满）';
    } else {
      if (RUN.hp + heal > RUN.maxHp && hasTrait('vampire')) {
        RUN.shield = (RUN.shield||0) + ((RUN.hp + heal) - RUN.maxHp);
        RUN.hp = RUN.maxHp;
        text += '（吸血鬼溢出转化为护盾）';
      } else {
        RUN.hp = clamp(RUN.hp + heal, 0, RUN.maxHp); 
        text += '（吸血回复 ' + heal + ' 点）'; 
      }
    }
  }
  
  if (cb.is_fire_trial) {
    if (hasTrait('flame') && hasTrait('fire_mastery') && hasPotionNamed('火油')) {
      RUN.subclass = 'fire_warrior';
      text += '<br><span class="good">火精灵化作一团火种融入了你的体内。你顿悟了火焰的极致！你觉醒了火纹战士的力量！</span>';
    } else {
      text += '<br>火精灵消散了，你感到一阵温暖，但由于条件不足（需要火焰附魔、火焰精通、火油），未能发生质变。';
    }
  }
  
  RUN.combat = null;
  
  if (e.boss){
    META.wins++;
    saveMeta();
    return winGame(text);
  }
  
  if (e.is_hidden) {
    addItem('dragon_heart');
    text += '<br>深渊魔龙陨落了。你挖出了它还在跳动的<b>龙之心</b>，这似乎是开启某种终极结局的钥匙。';
  }
  
  RUN.exp += expGain;
  if (expGain > 0) text += ' 获得 ' + expGain + ' 点经验。';
  
  let triggerTraitChoice = false;
  if (RUN.exp >= RUN.nextExp) {
    RUN.exp -= RUN.nextExp;
    RUN.level++;
    RUN.nextExp = Math.floor(RUN.nextExp * 1.5);
    RUN.maxHp += 6;
    RUN.hp = RUN.maxHp;
    RUN.attrs.str += 1; RUN.attrs.dex += 1; RUN.attrs.int += 1; RUN.attrs.wis += 1;
    text += '<br><span class="good">你升级了！等级 Lv.' + RUN.level + '（生命上限+6，全属性+1，生命已回满）</span>';
    triggerTraitChoice = true;
  }
  
  if (e.elite || e.miniboss || e.is_hidden) {
    triggerTraitChoice = true;
  }
  
  if (e.miniboss) {
    const it1 = pick(['bomb', 'whetstone', 'amulet', 'scroll_identify', 'rune_stone', 'fire_stone']);
    addItem(it1);
    text += '<br>你在它守卫的宝库里找到了：<b>' + ITEMS[it1].name + '</b>。';
  }
  
  if (triggerTraitChoice) {
    if (e.miniboss) {
      RUN.floor++;
      RUN.step = 0;
      RUN.floorFarms = 0;
      if (hasTrait('torchbearer')) RUN.torches += TRAITS.torchbearer.floorTorch;
      if (hasTrait('cursed')) RUN.torches = Math.max(0, RUN.torches - 1);
      if (hasTrait('shield')) RUN.shield = (RUN.shield||0) + TRAITS.shield.shield;
      
      if (RUN.floor > 5) {
        showTraitChoice(text, () => { bossIntro(); });
      } else {
        RUN.nodes = rollNodes();
        showTraitChoice(text, () => { renderFloor(); });
      }
    } else {
      showTraitChoice(text, () => { afterNode(); });
    }
    return;
  }

  if (Math.random() < 0.28 && penalty > 0){ 
    const it = pick(['bandage','torch_item','potion3','sausage','cheese','bread','bread']); 
    addItem(it); 
    text += ' 还有：' + getItemDef(it).name; 
  }
  
  if (e.miniboss) {
    RUN.floor++;
    RUN.step = 0;
    RUN.floorFarms = 0;
    if (hasTrait('torchbearer')) RUN.torches += TRAITS.torchbearer.floorTorch;
    if (hasTrait('cursed')) RUN.torches = Math.max(0, RUN.torches - 1);
    if (hasTrait('shield')) RUN.shield = (RUN.shield||0) + TRAITS.shield.shield;
    
    if (RUN.floor > 5) {
      setScene('<p>' + text + '</p>', [{label:'挑战骸骨之王', cls:'primary', fn: () => bossIntro()}]);
    } else {
      RUN.nodes = rollNodes();
      setScene('<p>' + text + '</p>', [{label:'进入第 '+RUN.floor+' 层', cls:'primary', fn: () => renderFloor()}]);
    }
  } else {
    setScene('<p>' + text + '</p>', [{label:'继续', cls:'primary', fn: afterNode}]);
  }
}
function observeEnemy(){
  const cb = RUN.combat;
  const e = ENEMIES[cb.id];
  const roll = d20();
  const pen = getTraitPenalty();
  let bonus = getMod(RUN.attrs.wis) + (pen.wis||0);

  RUN.lastDice = {
    bad: total < 12,

  };

  } else {
    cb.round++; // 观察算作一回合

function flee(){
  const roll = d20();
  const pen = getTraitPenalty();
  let bonus = getMod(RUN.attrs.dex) + (pen.dex||0);
  if (hasTrait('swift')) bonus += TRAITS.swift.flee;
  const total = roll + bonus;
  const dc = 12;
  RUN.lastDice = {
    bad: total < dc,
    html: '<span class="big">敏捷检定 · ' + (total >= dc ? '成功' : '失败') + '</span>' +
      'd20(' + roll + ') +' + getMod(RUN.attrs.dex) + ' = ' + total + ' vs DC ' + dc
  };
  if (total >= dc){
    RUN.combat = null;
    setScene('<p>你转身就跑，脚步声在通道里回荡了很久。</p>', [{label:'继续', cls:'primary', fn: afterNode}]);
  } else {
    const cb = RUN.combat;
    let dmg = Math.max(1, cb.atk[0] + rnd(cb.atk[1] - cb.atk[0] + 1) - getDef());
    if (hasTrait('glass_cannon')) dmg *= 2;
    RUN.hp -= dmg;
    if (RUN.hp <= 0) return die('你没能跑掉。');
    showCombat('你没跑掉，后背挨了一下，受到 ' + dmg + ' 点伤害。');
  }
}

function getMerchantTraits() {
  const specialTraits = ['blue_flame', 'warrior_unyielding', 'rogue_fatal', 'sage', 'scholar_omniscient'];
  const avail = Object.keys(TRAITS).filter(t => !hasTrait(t) && !specialTraits.includes(t) && !TRAITS[t].desc.includes('专属'));
  return shuffle(avail).slice(0, 3);
}

function renderMerchantScene() {
  const m = RUN.merchant;
  let html = '<p class="sys">神秘商人<br>金币: ' + RUN.gold + '</p>';
  html += '<h4>商品</h4>';
  m.items.forEach((s, i) => {
    const d = getItemDef(s.id);
    let price = s.price;
    if (hasTrait('greed')) price = Math.floor(price * 1.5);
    html += `<div class="row"><div class="info"><b>${d.name}</b><div class="sys">${d.desc}</div></div>
          <button data-buyitem="${i}">买 (${price} 金币)</button></div>`;
  });
  
  html += '<h4>词条</h4>';
  m.traits.forEach((t, i) => {
    const d = TRAITS[t];
    let price = 40;
    if (hasTrait('greed')) price = Math.floor(price * 1.5);
    html += `<div class="row"><div class="info"><b>${d.name}</b><div class="sys">${d.desc}</div></div>
          <button data-buytrait="${i}">买 (${price} 金币)</button></div>`;
  });
  
  html += '<h4>服务</h4>';
  html += `<div class="row"><div class="info"><b>刷新商品</b><div class="sys">重新生成商品和词条。</div></div>
        <button data-refresh="1">刷新 (${m.refreshCost} 金币)</button></div>`;
  
  html += `<div class="row"><div class="info"><b>去除负面词条</b><div class="sys">移除一个负面词条。</div></div>
        <button data-remove="1">去词条 (${m.removeCost} 金币)</button></div>`;
        
  html += `<div class="row"><div class="info"><b>卖掉闲置物品</b><div class="sys">半价出售背包里的物品。</div></div>
        <button data-sell="1">打开背包</button></div>`;

  const opts = [
    {label: '离开', cls: 'warn', fn: () => { RUN.merchant = null; afterNode(); }}
  ];
  setScene(html, opts);
  
  setTimeout(() => {
    const stage = document.getElementById('stage');
    stage.querySelectorAll('[data-buyitem]').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.getAttribute('data-buyitem');
        const s = m.items[idx];
        let price = s.price;
        if (hasTrait('greed')) price = Math.floor(price * 1.5);
        if (RUN.gold < price) return showModal('提示', '金币不足！');
        RUN.gold -= price;
        addItem(s.id);
        m.items.splice(idx, 1);
        renderMerchantScene();
        renderStatus();
      };
    });
    
    stage.querySelectorAll('[data-buytrait]').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.getAttribute('data-buytrait');
        const t = m.traits[idx];
        let price = 40;
        if (hasTrait('greed')) price = Math.floor(price * 1.5);
        if (RUN.gold < price) return showModal('提示', '金币不足！');
        RUN.gold -= price;
        applyEff({trait: t});
        m.traits.splice(idx, 1);
        renderMerchantScene();
        renderStatus();
      };
    });
    
    stage.querySelector('[data-refresh]').onclick = () => {
      if (RUN.gold < m.refreshCost) return showModal('提示', '金币不足！');
      RUN.gold -= m.refreshCost;
      m.refreshCost += 10;
      m.items = shuffle([
        {id:'bandage', price:12}, {id:'torch_item', price:8}, {id:'potion4', price:18},
        {id:'scroll_identify', price:15}, {id:'bomb', price:25}, {id:'whetstone', price:30},
        {id:'crowbar', price:20}, {id:'rune_stone', price:40}
      ]).slice(0,4);
      m.traits = getMerchantTraits();
      renderMerchantScene();
      renderStatus();
    };
    
    stage.querySelector('[data-remove]').onclick = () => {
      if (RUN.gold < m.removeCost) return showModal('提示', '金币不足！');
      const negTraits = RUN.traits.filter(t => ['weak','slow','blind','bad_luck','cursed','paranoia','wound','broken_pocket','gluttony','arrogance'].includes(t));
      if (negTraits.length === 0) return showModal('提示', '你没有负面词条！');
      
      let listH = '<h3>选择要去除的负面词条</h3>';
      negTraits.forEach(t => {
        const d = TRAITS[t];
        listH += `<div class="row"><div class="info"><b>${d.name}</b><div class="sys">${d.desc}</div></div>
                  <button data-rmt="${t}">移除</button></div>`;
      });
      listH += '<button class="bigbtn" id="backMerchantBtn">返回</button>';
      openPanel(listH);
      
      document.getElementById('backMerchantBtn').onclick = () => { closePanel(); renderMerchantScene(); };
      document.getElementById('panel').querySelectorAll('[data-rmt]').forEach(b => {
        b.onclick = () => {
          const t = b.getAttribute('data-rmt');
          RUN.gold -= m.removeCost;
          m.removeCost += 20;
          RUN.traits = RUN.traits.filter(x => x !== t);
          closePanel();
          renderMerchantScene();
          renderStatus();
        };
      });
    };
    
    stage.querySelector('[data-sell]').onclick = () => {
      let listH = '<h3>选择要出售的物品</h3>';
      const counts = {};
      RUN.inv.forEach((it, i) => {
        if (!counts[it.id]) counts[it.id] = { count: 0, originalIndex: i, item: it };
        counts[it.id].count++;
      });
      
      for (const id in counts) {
        if (isPotion(id)) continue; 
        const d = getItemDef(id);
        const sellPrice = 5 + RUN.floor * 2;
        listH += `<div class="row"><div class="info"><b>${d.name} x${counts[id].count}</b><div class="sys">${d.desc}</div></div>
                  <button data-sellid="${id}">卖 (${sellPrice} 金币)</button></div>`;
      }
      listH += '<button class="bigbtn" id="backMerchantBtn">返回</button>';
      openPanel(listH);
      
      document.getElementById('backMerchantBtn').onclick = () => { closePanel(); renderMerchantScene(); };
      document.getElementById('panel').querySelectorAll('[data-sellid]').forEach(b => {
        b.onclick = () => {
          const sellId = b.getAttribute('data-sellid');
          const idx = RUN.inv.findIndex(it => it.id === sellId);
          if (idx >= 0) {
            RUN.inv.splice(idx, 1);
            RUN.gold += 5 + RUN.floor * 2;
            closePanel();
            renderMerchantScene();
            renderStatus();
          }
        };
      });
    };
  }, 0);
}

function hasItemInInventory(id) {
  return RUN.inv.some(i=>i.id===id);
}
function hasPotionNamed(name) {
  for (const it of RUN.inv) {
    if (isPotion(it.id)) {
      const ci = potionColorIndex(it.id);
      if (RUN.identified[ci] && POTIONS[RUN.potionMap[ci]].name === name) return true;
    }
  }
  return false;
}

function showTraitChoice(prefix, callback){
  const avail = Object.keys(TRAITS).filter(t => {
    if (hasTrait(t)) return false;
    if (t === 'blue_flame' && !hasTrait('flame') && !hasTrait('fire_mastery')) return false;
    if (t === 'warrior_unyielding' && RUN.cls !== 'warrior') return false;
    if (t === 'rogue_fatal' && RUN.cls !== 'rogue') return false;
    if ((t === 'sage' || t === 'scholar_omniscient') && RUN.cls !== 'scholar') return false;
    return true;
  });
  
  if (avail.length === 0) {
    const gold = 20;
    RUN.gold += gold;
    setScene('<p>' + prefix + '</p><p>你在这堆残骸中翻了翻，找到一些金币。你已掌握了所有的战技。</p><p class="sys">金币 +' + gold + '</p>', [{label:'继续', cls:'primary', fn: callback || afterNode}]);
    renderStatus();
    return;
  }

  const choices = shuffle(avail).slice(0, 3);
  const opts = choices.map(tId => ({
    label: '<b>' + TRAITS[tId].name + '</b><small>' + TRAITS[tId].desc + '</small>',
    cls: 'primary',
    fn: () => {
      applyEff({trait: tId});
      const t = TRAITS[tId];
      
      let extraText = '';
      if (t.def) extraText = '防御 +' + t.def;
      if (t.atkCheck) extraText = '攻击检定 +' + t.atkCheck;
      if (t.maxHpPenalty) extraText = '生命上限 -' + t.maxHpPenalty;
      
      setScene('<p>你从它的残骸中领悟了什么。</p><p class="good">获得词条：<b>' + t.name + '</b> ' + extraText + '</p>', [{label:'继续', cls:'primary', fn: callback || afterNode}]);
      renderStatus();
    }
  }));

  if (choices.length < 3) {
    opts.push({label:'放弃领悟，搜刮残骸（+15 金币）', fn: () => {
      RUN.gold += 15;
      setScene('<p>你放弃了深究它身上的秘密，只搜刮了些许金币。</p>', [{label:'继续', cls:'primary', fn: callback || afterNode}]);
      renderStatus();
    }});
  }

  setScene('<p>' + prefix + '</p>' +
    '<p>你在它消散的躯体里，看到了几种不同流向的力量。你只能抓住其中一种。</p>', opts);
}

function getSubclassData() {
  if (RUN.subclass === 'fire_warrior') return {name:'火纹战士'};
  if (RUN.subclass === 'blood_warrior') return {name:'嗜血战士'};
  if (RUN.subclass === 'berserker') return {name:'狂战士'};
  if (RUN.subclass === 'assassin') return {name:'刺客'};
  if (RUN.subclass === 'shadow') return {name:'暗影舞者'};
  if (RUN.subclass === 'elementalist') return {name:'元素使'};
  if (RUN.subclass === 'necromancer') return {name:'死灵法师'};
  return null;
}

function afterNode(){
  if (RUN.hp <= 0) return die('你倒下了。');
  
  if (RUN.step >= 10){
    RUN.step = 0;
    if (RUN.floor > 5) return bossIntro();
    
    if (hasTrait('torchbearer')) RUN.torches += TRAITS.torchbearer.floorTorch;
    if (hasTrait('cursed')) RUN.torches = Math.max(0, RUN.torches - 1);
    if (hasTrait('shield')) RUN.shield = (RUN.shield||0) + TRAITS.shield.shield;
    
    return miniBossIntro();
  }
  RUN.nodes = rollNodes();
  renderFloor();
}

function miniBossIntro(){
  const mbMap = {
    1: 'miniboss_1',
    2: 'miniboss_2',
    3: 'miniboss_3',
    4: 'miniboss_4',
    5: 'miniboss_5'
  };
  const mbId = mbMap[RUN.floor] || 'miniboss_1';
  const mb = ENEMIES[mbId];
  
  setScene('<p>通往第 ' + (RUN.floor + 1) + ' 层的阶梯被一道沉重的铁栅栏挡住了。</p>' +
    '<p>栅栏前，盘踞着一个庞大的身影——<b>' + mb.name + '</b>。</p>' +
    '<p class="sys">击败它才能继续深入。</p>',
    [{label:'拔出武器迎战', cls:'danger', fn: () => startCombat(mbId)}]);
}

function bossIntro(){
  setScene('<p>通道尽头是一扇巨大的骨门。门后是一整个洞窟，堆满了骨头。</p>' +
    '<p>它坐在骨头堆成的王座上。王冠是某个人的头骨。它站了起来。</p>',
    [{label:'拔出武器', cls:'danger', fn: () => startCombat('boss')}]);
}
function die(cause){
  RUN.hp = 0;
  const desc = '第 ' + RUN.floor + ' 层 · ' + cause;
  META.deaths.push(desc);
  META.runs++;
  saveMeta();
  RUN.combat = null;
  setScene(
    '<p class="em">你死了。</p>' +
    '<p>' + desc + '</p>' +
    '<p class="sys">死亡次数：' + META.deaths.length + '　最深：第 ' + maxDepth() + ' 层</p>',
    [{label:'重新开始', cls:'primary', fn: () => { RUN = null; render(); }}]
  );
}
function winGame(prefix){
  META.wins++;
  
  let endingTitle = '普通结局：深潜者';
  let endingText = '骸骨之王倒下了。你从它的王冠里取出一块温热的黑色石头，然后朝来路走去。你成为了这片地牢新的传说，但你知道，深渊还在呼唤。';
  
  if (RUN.inv.some(i => i.id === 'dragon_heart')) {
    endingTitle = '真结局：屠龙者';
    endingText = '你握着龙之心，地牢的阴影在你面前退散。你不仅击败了骸骨之王，更碾碎了深渊的意志。你带着巨龙的力量重返地表，世界将因你而颤抖。';
  } else if (RUN.cls === 'warrior' && (hasTrait('warrior_unyielding') || RUN.subclass === 'fire_warrior')) {
    endingTitle = '战士专属结局：剑之极意';
    endingText = '你凭借不屈的意志粉碎了骸骨之王。王座崩塌时，无数英灵的剑鸣在你耳边回荡。你成为了名副其实的剑圣，余生都在寻找更强的对手。';
  } else if (RUN.cls === 'rogue' && (hasTrait('rogue_fatal') || RUN.subclass === 'assassin')) {
    endingTitle = '盗贼专属结局：暗影之主';
    endingText = '骸骨之王甚至没看清你的动作，致命的毒刃就切断了它的命脉。你带着无尽的财宝悄然离去。地牢的阴影中，多了一个无人敢提及的幽灵。';
  } else if (RUN.cls === 'scholar' && (hasTrait('scholar_omniscient') || RUN.subclass === 'elementalist')) {
    endingTitle = '学者专属结局：真理守望者';
    endingText = '你轻易看穿了骸骨之王的弱点，用纯粹的法术将其化为灰烬。你更在意的是地牢深处隐藏的远古知识。你留在了这里，继续探寻宇宙的终极真理。';
  }

  if (!META.endings) META.endings = [];
  if (!META.endings.includes(endingTitle)) {
    META.endings.push(endingTitle);
  }
  saveMeta();

  setScene(
    '<p class="good">' + endingTitle + '</p>' +
    '<p>' + (prefix || '') + '</p>' +
    '<p>' + endingText + '</p>' +
    '<p class="sys">通关次数：' + META.wins + '</p>',
    [{label:'重新开始', cls:'primary', fn: () => { RUN = null; render(); }}]
  );
}
function maxDepth(){
  let m = 0;
  META.deaths.forEach(d => {
    const n = parseInt(d.replace(/[^0-9].*/, '')) || 0;
    if (n > m) m = n;
  });
  return m;
}

function setScene(html, opts){
  if (!RUN) return;
  RUN.scene = { html:html, opts:opts || [] };
  render();
}

function render(){
  if (!RUN){
    renderTitle();
    return;
  }
  renderStatus();
  
  const stage = document.getElementById('stage');
  if (!stage) return;
  
  let h = '';
  if (RUN.lastDice){
    h += '<div class="dicebar' + (RUN.lastDice.bad ? ' bad' : '') + '">' + RUN.lastDice.html + '</div>';
  }
  h += '<div id="narrative">' + (RUN.scene ? RUN.scene.html : '') + '</div>';
  h += '<div id="actions"></div>';
  stage.innerHTML = h;
  
  const act = document.getElementById('actions');
  if (!act) return;
  
  const opts = (RUN.scene && RUN.scene.opts) || [];
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt ' + (o.cls || '');
    b.innerHTML = o.label;
    b.onclick = () => {
      RUN.lastDice = null;
      o.fn();
    };
    act.appendChild(b);
  });
  stage.scrollTop = 0;
  
  const elBag = document.getElementById('tabBag'); if (elBag) elBag.disabled = false;
  const elLog = document.getElementById('tabLog'); if (elLog) elLog.disabled = false;
  const elDex = document.getElementById('tabDex'); if (elDex) elDex.disabled = false;
}

function renderStatus(){
  const sb = document.getElementById('statusbar');
  if (!sb) return;
  const dark = RUN.torches <= 0;
  sb.className = dark ? 'darkmode' : '';
  const cls = CLASSES.find(c => c.id === RUN.cls) || CLASSES[0];
  const hpPct = Math.round(RUN.hp / RUN.maxHp * 100);
  const lvlStr = 'Lv.' + (RUN.level||1) + ' (' + (RUN.exp||0) + '/' + (RUN.nextExp||20) + ')';
  let subStr = '';
  if (RUN.subclass) {
    subStr = ' [' + getSubclassData().name + ']';
  }
  
  let shieldHtml = '';
  if (RUN.shield > 0) shieldHtml = '<span class="chip" style="color:#4f7a4a;">护盾 <b>' + RUN.shield + '</b></span>';
  
  sb.innerHTML =
    '<span class="chip"><b>' + cls.name + subStr + '</b> ' + lvlStr + '</span>' +
    '<span class="chip">生命 <span class="hpbar"><i style="width:' + hpPct + '%"></i></span> <b>' + RUN.hp + '/' + RUN.maxHp + '</b></span>' +
    shieldHtml +
    '<span class="chip">火把 <b>' + RUN.torches + '</b></span>' +
    '<span class="chip">金币 <b>' + RUN.gold + '</b></span>' +
    (RUN.luck ? '<span class="chip">幸运 <b>' + RUN.luck + '</b></span>' : '') +
    '<span class="chip">第 <b>' + RUN.floor + '</b> 层</span>';
}

function renderTitle(){
  const sb = document.getElementById('statusbar');
  if (sb) sb.innerHTML = '<span class="chip"><b>深潜</b> · 文字地下城</span>';
  
  const elBag = document.getElementById('tabBag'); if (elBag) elBag.disabled = true;
  const elLog = document.getElementById('tabLog'); if (elLog) elLog.disabled = false;
  const elDex = document.getElementById('tabDex'); if (elDex) elDex.disabled = false;
  
  const stage = document.getElementById('stage');
  if (!stage) return;
  
  let h = '<div class="title-wrap">';
  h += '<h1>深潜</h1><div class="sub">DEEP DELVE</div>';
  h += '<div class="blurb">你带着火把下潜五层。<br>每层都有不同的怪物和试炼。<br>寻找隐藏的裂缝，或者触发你的专属结局。<br>死了就死了——但你会记住。</div>';
  h += '</div>';
  h += '<div id="actions"></div>';
  stage.innerHTML = h;
  
  const act = document.getElementById('actions');
  if (!act) return;
  
  CLASSES.forEach(c => {
    const b = document.createElement('button');
    b.className = 'opt primary';
    b.innerHTML = c.name + '<small>' + c.desc + '</small>';
    b.onclick = () => newRun(c.id);
    act.appendChild(b);
  });
  stage.scrollTop = 0;
}

function newRun(clsId){
  const c = CLASSES.find(x => x.id === clsId) || CLASSES[0];
  RUN = {
    cls: clsId,
    attrs: Object.assign({}, c.attrs),
    hp: c.hp, maxHp: c.hp,
    torches: c.torches, gold: c.gold, luck: 1,
    inv: c.items.map(id => {
      let obj = { id: id };
      if (id === 'rogue_trick') obj.uses = 15;
      return obj;
    }),
    traits: [],
    floor: 1, step: 0,
    potionMap: shuffle([0,1,2,3,4,5]),
    identified: {},
    atkBonus: 0,
    nodes: [], scene: null, combat: null, lastDice: null,
    log: [], 
    level: 1, exp: 0, nextExp: 20,
    shield: 0,
    forgeCount: 0,
    boughtEnchant: false,
    bonusDef: 0,
    subclass: null,
    floorFarms: 0
  };
  RUN.inv.push({ id:'potion' + rnd(6) });
  RUN.inv.push({ id:'potion' + rnd(6) });
  goFloor();
}
function resumeRun(){
  if (!RUN) return;
  if (!RUN.scene){
    if (RUN.step >= 10){ RUN.step = 0; RUN.floor++; }
    if (RUN.floor > 5) return bossIntro();
    RUN.nodes = rollNodes();
    renderFloor();
  } else {
    render();
  }
}

function closePanel(){
  const ov = document.getElementById('overlay');
  if (ov) ov.classList.add('hidden');
  const pn = document.getElementById('panel');
  if (pn) pn.innerHTML = '';
}
function openPanel(html){
  const pn = document.getElementById('panel');
  if (pn) pn.innerHTML = html;
  const ov = document.getElementById('overlay');
  if (ov) ov.classList.remove('hidden');
}

function openBagPanel(){
  if (!RUN) return;
  let h = '<h3>背包</h3>';
  if (RUN.inv.length === 0) h += '<p class="sys">空空如也。</p>';
  
  const counts = {};
  RUN.inv.forEach((it, i) => {
    if (!counts[it.id]) counts[it.id] = { count: 0, originalIndex: i, item: it };
    counts[it.id].count++;
  });
  
  for (const id in counts) {
    const c = counts[id];
    const d = getItemDef(id);
    const it = c.item;
    
    let btnLabel = '使用';
    if (d.potion) {
      const p = POTIONS[RUN.potionMap[d.colorIndex]];
      const isFireOil = (p.name === '火油');
      const isPoison = (p.name === '毒药');
      
      if (RUN.combat && isPoison) {
        btnLabel = '投掷';
      } else if (RUN.combat && isFireOil) {
        btnLabel = '投掷';
      } else if (RUN.identified[d.colorIndex]) {
        btnLabel = isFireOil && !RUN.combat ? '不能喝' : '喝下';
      } else {
        btnLabel = RUN.combat ? '喝下' : '鉴定';
      }
    } else if (it.id === 'rogue_trick') {
      if (!it.uses && it.uses !== 0) it.uses = 15; 
      btnLabel = '搜刮 (' + it.uses + '次)';
      if (it.uses <= 0) btnLabel = '次数耗尽';
    }
    
    let nameStr = d.name;
    if (c.count > 1) nameStr += ' x' + c.count;
    
    h += '<div class="row"><div class="info"><b>' + nameStr + '</b>' +
      (d.potion && !RUN.identified[d.colorIndex] ? '<span class="tag">未鉴定</span>' : '') +
      '<div class="sys">' + d.desc + '</div></div>';
    if (d.type === 'use' || d.potion){
      if (btnLabel === '不能喝' || btnLabel === '次数耗尽') {
        h += '<button disabled>' + btnLabel + '</button>';
      } else {
        h += '<button data-use="' + c.originalIndex + '">' + btnLabel + '</button>';
      }
    }
    h += '</div>';
  }
  
  h += '<button class="bigbtn" id="closePanelBtn">关闭</button>';
  openPanel(h);
  
  const btn = document.getElementById('closePanelBtn');
  if (btn) btn.onclick = closePanel;
  
  const panel = document.getElementById('panel');
  if (panel) {
    panel.querySelectorAll('[data-use]').forEach(btn => {
      btn.onclick = () => {
        const idx = +btn.getAttribute('data-use');
        useItemAt(idx);
      };
    });
  }
}

function useItemAt(idx){
  if (!RUN || !RUN.inv[idx]) return;
  const it = RUN.inv[idx];
  const d = getItemDef(it.id);
  let msg = '';
  let consumed = true;
  
  if (d.potion){
    const ci = potionColorIndex(it.id);
    const p = POTIONS[RUN.potionMap[ci]];
    const isPoison = (p.name === '毒药');
    const isFireOil = (p.name === '火油');
    const isGoldSol = (p.name === '金溶液');
    
    if (RUN.combat && (isPoison || isFireOil)) {
      let dmg = isPoison ? (10 + RUN.floor * 2) : (15 + RUN.floor * 2);
      RUN.combat.hp -= dmg;
      msg = '你把' + p.name + '泼向敌人，造成 ' + dmg + ' 点真实伤害！';
      consumed = true;
      if (RUN.combat.hp <= 0) {
        closePanel();
        RUN.inv.splice(idx, 1);
        return killEnemy(msg);
      }
    } else if (!RUN.identified[ci] && !RUN.combat) {
      if (RUN.cls === 'scholar') {
        RUN.identified[ci] = true;
        consumed = false;
        msg = '作为学者，你仔细观察了这瓶' + POTION_COLORS[ci] + '色的药水。<br><span class="good">已鉴定为：' + p.name + '。</span>';
        openBagPanel(); 
        return;
      } else if (hasItemInInventory('scroll_identify')) {
        removeItem('scroll_identify');
        RUN.identified[ci] = true;
        consumed = false;
        msg = '你消耗了一张鉴定卷轴，认出了这瓶药水。<br><span class="good">已鉴定为：' + p.name + '。</span>';
        openBagPanel(); 
        return;
      } else {
        msg = '你不能直接鉴定药水，需要购买【鉴定卷轴】。';
        consumed = false;
        openBagPanel();
        return;
      }
    } else if (isGoldSol) {
      RUN.hp -= 10;
      RUN.bonusDef = (RUN.bonusDef||0) + 2;
      msg = '你喝下了金溶液，剧痛传遍全身，但你的皮肤变得像金属一样坚硬。（生命 -10，防御永久 +2）';
      if (RUN.hp <= 0) { closePanel(); RUN.inv.splice(idx, 1); return die('你被金溶液毒死了。'); }
    } else {
      RUN.identified[ci] = true;
      applyEff(p.eff);
      msg = p.text;
      if (hasTrait('alchemist')) {
        applyEff(p.eff);
        msg += '（炼金师：效果翻倍！）';
      }
    }
  } else if (d.type === 'use'){
    if (it.id === 'scroll_identify') {
      let unid = [];
      RUN.inv.forEach((invIt) => {
        if (isPotion(invIt.id) && !RUN.identified[potionColorIndex(invIt.id)]) unid.push(invIt);
      });
      if (unid.length > 0) {
        const target = unid[0];
        RUN.identified[potionColorIndex(target.id)] = true;
        msg = '卷轴化为灰烬。你弄懂了' + POTION_COLORS[potionColorIndex(target.id)] + '色药水的用途。';
      } else {
        msg = '你身上没有未鉴定的药水。卷轴浪费了。';
      }
    } else if (it.id === 'bomb') {
      if (RUN.combat) {
        RUN.combat.hp -= 15;
        msg = '炸弹轰然爆炸，对敌人造成了 15 点真实伤害！';
        if (RUN.combat.hp <= 0) {
          consumed = true;
          closePanel();
          RUN.inv.splice(idx, 1);
          return killEnemy(msg);
        }
      } else {
        msg = '这里没有敌人让你炸。';
        consumed = false;
      }
    } else if (it.id === 'rogue_trick') {
      if (!it.uses && it.uses !== 0) it.uses = 15;
      if (RUN.combat) {
        msg = '战斗中无法使用这项技艺。';
        consumed = false;
      } else if (it.uses <= 0) {
        msg = '这份技艺的配方已经磨损殆尽了。';
        consumed = false;
      } else {
        it.uses--;
        const roll = d20();
        const bonus = getMod(RUN.attrs.dex);
        RUN.lastDice = {
          bad: roll + bonus < 12,
          html: '<span class="big">敏捷检定 · ' + (roll+bonus >= 12 ? '成功' : '失败') + '</span>' +
            'd20(' + roll + ') +' + bonus + ' = ' + (roll+bonus) + ' vs DC 12'
        };
        if (roll + bonus >= 12) {
          const rewards = [
            {text: '你撬开了一个废弃的柜子，找到了几枚金币。', eff: {gold: 20}},
            {text: '你在角落发现了一个别人遗漏的药瓶。', eff: {item: 'potion' + rnd(6)}},
            {text: '你找到了一个急救包。', eff: {item: 'bandage'}}
          ];
          const r = pick(rewards);
          msg = r.text;
          applyEff(r.eff);
        } else {
          msg = '你搜刮了半天，不但什么也没找到，还弄出了一点动静。';
          RUN.hp -= 2;
        }
        consumed = false; 
      }
    } else {
      if (ITEMS[it.id] && ITEMS[it.id].eff) applyEff(ITEMS[it.id].eff);
      msg = '你使用了' + d.name + '。';
    }
  }
  
  if (consumed) RUN.inv.splice(idx, 1);
  closePanel();
  if (RUN.hp <= 0) return die('你倒下了。');
  
  if (RUN.combat){
    const cb = RUN.combat;
    let dmg = Math.max(1, cb.atk[0] + rnd(cb.atk[1] - cb.atk[0] + 1) - getDef());
    if (hasTrait('glass_cannon')) dmg *= 2;
    RUN.hp -= dmg;
    msg += '　它趁机攻击你，受到 ' + dmg + ' 点伤害。';
    if (RUN.hp <= 0) return die('你倒下了。');
    showCombat(msg);
  } else {
    const prevScene = RUN.scene;
    setScene('<p>' + msg + '</p>', [{label:'继续', cls:'primary', fn: () => {
      if (prevScene) {
        RUN.scene = prevScene;
        render();
      } else {
        renderFloor();
      }
    }}]);
  }
}

function openLogPanel(){
  let h = '<h3>状态与日志</h3>';
  
  h += '<h4>已获词条</h4>';
  if (!RUN || RUN.traits.length === 0) {
    h += '<p class="sys">暂无词条。</p>';
  } else {
    h += '<div class="grid-container" id="traits-grid">';
    RUN.traits.forEach(t => {
      const d = TRAITS[t];
      if (d) {
        const isNeg = ['weak','slow','blind','bad_luck','cursed','wound','broken_pocket','gluttony','arrogance'].includes(t);
        const color = isNeg ? 'color:#8a4436;' : (t.includes('pact')||t.includes('cannon')||t.includes('gambler')||t.includes('paranoia')?'color:#c09020;':'');
        h += `<div class="grid-item" data-title="${d.name}" data-desc="${d.desc}">
                <b style="${color}">${d.name}</b>
                <small>${isNeg?'负面':'增益'}</small>
              </div>`;
      }
    });
    h += '</div>';
  }
  
  h += '<h4 style="margin-top:24px;">探索日志</h4>';
  let logs = [];
  if (RUN && RUN.log) logs = RUN.log;
  
  if (logs.length === 0) {
    h += '<p class="sys">当前局暂无记录。</p>';
  } else {
    logs.slice(-20).forEach(l => { h += '<div class="row"><div class="info sys">' + l + '</div></div>'; });
  }
  
  h += '<button class="bigbtn" id="closePanelBtn">关闭</button>';
  openPanel(h);
  
  const panel = document.getElementById('panel');
  if (panel) {
    panel.querySelectorAll('.grid-item').forEach(el => {
      el.onclick = () => {
        showModal(el.getAttribute('data-title'), el.getAttribute('data-desc'));
      };
    });
  }
  
  const btn = document.getElementById('closePanelBtn');
  if (btn) btn.onclick = closePanel;
}

function openDexPanel(){
  let h = '<h3>图鉴收集</h3>';
  
  h += '<h4>怪物图鉴</h4>';
  const seen = Object.keys(META.bestiary);
  if (!seen.length) {
    h += '<p class="sys">还没有见过任何东西。</p>';
  } else {
    h += '<div class="grid-container" id="dex-grid">';
    seen.forEach(k => {
      const e = ENEMIES[k];
      if (!e) return;
      h += `<div class="grid-item" data-title="${e.name}" data-desc="${e.desc}\n\n情报：${e.info}">
              <b>${e.name}</b>
              <small>点击查看</small>
            </div>`;
    });
    h += '</div>';
  }
  
  h += '<h4 style="margin-top:24px;">结局收集（' + (META.endings ? META.endings.length : 0) + '）</h4>';
  if (!META.endings || !META.endings.length) {
    h += '<p class="sys">还没有达成任何结局。</p>';
  } else {
    META.endings.forEach(ed => {
      h += '<div class="row"><div class="info"><b style="color:#4f7a4a;">' + ed + '</b></div></div>';
    });
  }

  h += '<h4 style="margin-top:24px;">死法收集（' + META.deaths.length + '）</h4>';
  if (!META.deaths.length) h += '<p class="sys">还没有死过。</p>';
  META.deaths.slice(-10).forEach(d => {
    h += '<div class="row"><div class="info sys">' + d + '</div></div>';
  });
  
  h += '<button class="bigbtn" id="closePanelBtn">关闭</button>';
  openPanel(h);
  
  const panel = document.getElementById('panel');
  if (panel) {
    panel.querySelectorAll('.grid-item').forEach(el => {
      el.onclick = () => {
        showModal(el.getAttribute('data-title'), el.getAttribute('data-desc'));
      };
    });
  }
  
  const btn = document.getElementById('closePanelBtn');
  if (btn) btn.onclick = closePanel;
}

function openSavePanel(){
  let h = '<h3>存档码</h3>';
  h += '<p class="sys">生成一段存档码，复制保存后可在其他设备导入，继续当前进度。</p>';
  h += '<textarea id="saveOut" readonly>点击下方按钮生成</textarea>';
  h += '<button class="bigbtn" id="genBtn">生成存档码</button>';
  h += '<h4>导入存档码</h4>';
  h += '<textarea id="saveIn" placeholder="粘贴存档码…"></textarea>';
  h += '<button class="bigbtn warn" id="loadBtn">导入</button>';
  h += '<button class="bigbtn" id="closePanelBtn">关闭</button>';
  openPanel(h);
  
  const btnC = document.getElementById('closePanelBtn');
  if (btnC) btnC.onclick = closePanel;
  
  const btnG = document.getElementById('genBtn');
  if (btnG) btnG.onclick = () => {
    const code = exportCode();
    const so = document.getElementById('saveOut');
    if (so) so.value = code;
    try{ navigator.clipboard.writeText(code); }catch(e){}
    btnG.textContent = '已生成并尝试复制';
  };
  
  const btnL = document.getElementById('loadBtn');
  if (btnL) btnL.onclick = () => {
    try{
      const si = document.getElementById('saveIn');
      importCode(si ? si.value : '');
      closePanel();
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
}

// 初始化
function init(){
  const tabBag = document.getElementById('tabBag'); if (tabBag) tabBag.onclick = openBagPanel;
  const tabLog = document.getElementById('tabLog'); if (tabLog) tabLog.onclick = openLogPanel;
  const tabDex = document.getElementById('tabDex'); if (tabDex) tabDex.onclick = openDexPanel;
  const tabSave = document.getElementById('tabSave'); if (tabSave) tabSave.onclick = openSavePanel;
  
  const overlay = document.getElementById('overlay'); 
  if (overlay) {
    overlay.onclick = (e) => { if (e.target.id === 'overlay') closePanel(); };
  }

  loadMeta();
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
</body>
</html>
